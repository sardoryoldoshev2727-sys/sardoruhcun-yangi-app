    <style>
      #v4-launch {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(circle at 86% 14%, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 46%),
          linear-gradient(160deg, #9B111E 0%, #6E0B15 56%, #3A0A10 100%);
        color: #FFFFFF;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        transition: opacity 240ms cubic-bezier(0.2, 0, 0, 1);
      }
      #v4-launch.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .v4-launch-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.94);
      }
      .v4-launch-seeds {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      @keyframes seedLight {
        0% {
          opacity: 0.28;
          transform: scale(0.86);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .v4-seed {
        opacity: 0.28;
        transform: scale(0.86);
        animation: seedLight 260ms cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
      }
      .v4-seed-2 {
        animation-delay: 140ms;
      }
      .v4-seed-3 {
        animation-delay: 280ms;
      }
      @media (prefers-reduced-motion: reduce) {
        .v4-seed {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="v4-launch" aria-hidden="true">
      <div class="v4-launch-seeds">
        <svg class="v4-seed v4-seed-1" width="20" height="26" viewBox="0 0 20 26" fill="none">
          <path d="M10 1.5C14.5 6.8 18 11.4 18 16C18 20.6 14.4 24.5 10 24.5C5.6 24.5 2 20.6 2 16C2 11.4 5.5 6.8 10 1.5Z" fill="#FFFFFF" fill-opacity="0.92"/>

        </svg>
        <svg class="v4-seed v4-seed-2" width="20" height="26" viewBox="0 0 20 26" fill="none">

          <path d="M10 6.5C12.2 9.8 13.5 12.6 13.5 15.6C13.5 17.8 11.9 19.6 10 19.6" stroke="#9B111E" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
        </svg>
        <svg class="v4-seed v4-seed-3" width="20" height="26" viewBox="0 0 20 26" fill="none">
          <path d="M10 1.5C14.5 6.8 18 11.4 18 16C18 20.6 14.4 24.5 10 24.5C5.6 24.5 2 20.6 2 16C2 11.4 5.5 6.8 10 1.5Z" fill="#FFFFFF" fill-opacity="0.92"/>
          <path d="M10 6.5C12.2 9.8 13.5 12.6 13.5 15.6C13.5 17.8 11.9 19.6 10 19.6" stroke="#9B111E" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
        </svg>
      </div>
      <div class="v4-launch-title">Lal Anaar</div>
    </div>
