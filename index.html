<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:title" content="Lal Anaar — Do'konchi ilovasi" />
    <meta property="og:description" content="Termizdagi Brightly Mega Water (Lal Anaar) ulgurji sharbat va ichimliklar buyurtma tizimi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #v4-launch {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(circle at 86% 14%, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 48%),
          linear-gradient(160deg, #9B111E 0%, #6E0B15 56%, #3A0A10 100%);
        color: #FFFFFF;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        transition: opacity 240ms cubic-bezier(0.2, 0, 0, 1);
      }
      #v4-launch.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .v4-launch-logo-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        opacity: 0;
        transform: scale(0.9);
        animation: v4LogoScaleIn 380ms 180ms cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
      }
      .v4-launch-logo-wrap::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0) 80%);
        transform: translateX(-140%);
        animation: v4LogoSweep 520ms 380ms cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
      }
      .v4-launch-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: relative;
        z-index: 1;
      }
      .v4-launch-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.96);
        opacity: 0;
        animation: v4TitleFade 220ms 40ms cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
      }
      @keyframes v4TitleFade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes v4LogoScaleIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes v4LogoSweep {
        from { transform: translateX(-140%); }
        to { transform: translateX(160%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .v4-launch-logo-wrap,
        .v4-launch-title {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .v4-launch-logo-wrap::after {
          animation: none;
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="v4-launch" aria-hidden="true">
      <div class="v4-launch-logo-wrap">
        <img src="./img/logo.webp" alt="Lal Anaar" class="v4-launch-logo" />
      </div>
      <div class="v4-launch-title">Lal Anaar</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
